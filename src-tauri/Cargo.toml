[package]
name = "junlive"
version = "1.1.3"
license = "MIT"
description = "JunLive —— 多平台直播聚合桌面客户端（斗鱼/虎牙/B站/抖音/YouTube/SOOP/Twitch）"
authors = ["xinyuzjj"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "junlive_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# 安卓沉浸式全屏要经 JNI 调 WindowInsetsController。
# 版本必须与 tao/wry 拉的完全一致（0.21.1），否则 jni 的类型无法在两边传递 ——
# jni 的 JObject/JValue 不保证跨 crate 版本兼容。
jni = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP / 异步
# 用 native-tls（Windows 上即 schannel）：斗鱼的部分 CDN 用 rustls 握手会失败
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "native-tls",
  "gzip",
  "brotli",
  "socks",
  "stream",
  "cookies",
] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
# WS 走代理要自己 CONNECT 再套 TLS
native-tls = "0.2"
tokio-native-tls = "0.3"
futures-util = "0.3"

# 本地流代理服务器
axum = "0.8"
bytes = "1"
http-body-util = "0.1"

# 工具
md5 = "0.7"
rand = "0.8"
regex = "1"
base64 = "0.22"
urlencoding = "2"
once_cell = "1"
thiserror = "2"
chrono = "0.4"
brotli = "8"
# 抖音弹幕的帧是 gzip 压缩的
flate2 = "1"

# 抖音 WS 的 X-Bogus 签名要跑 sign.js（混淆 JS），
# 用 QuickJS 在本地算。不开 bindgen 特性——它需要 libclang。
rquickjs = { version = "0.9", default-features = false, features = ["loader", "macro"] }

# Android 上没有系统 OpenSSL，但 native-tls 会拖进 openssl-sys，
# 构建时报 `Could not find directory of OpenSSL installation` 直接失败。
# 加上 vendored 让它在编译期用 NDK 的 clang 自带一份 OpenSSL（不需要本地装任何东西）。
# 桌面端和 iOS 不受影响（Windows 用 schannel、macOS/iOS 用 Security.framework）。
#
# rquickjs-sys 只带了常见桌面目标的预生成绑定，**没有 aarch64-linux-android**，
# 不加 bindgen 会报 `couldn't find file .../bindings/aarch64-linux-android.rs`。
# 所以 Android 上开 bindgen 现场生成（CI 里要装 libclang + clang）。
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
rquickjs = { version = "0.9", default-features = false, features = [
  "loader",
  "macro",
  "bindgen",
] }

# iOS 同理：rquickjs-sys 也没有 aarch64-apple-ios / aarch64-apple-ios-sim 的预生成绑定，
# 不开 bindgen 会报 `couldn't find file .../bindings/aarch64-apple-ios-sim.rs`。
# macOS 上 Xcode 自带 libclang，CI 不用额外装（只补个 LIBCLANG_PATH 兜底）。
[target.'cfg(target_os = "ios")'.dependencies]
rquickjs = { version = "0.9", default-features = false, features = [
  "loader",
  "macro",
  "bindgen",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# dev 构建（含安卓 debug APK）默认带完整调试符号 —— 一个 arm64 包能到 198 MB，
# 手机上装起来又慢又占地方。剥掉调试信息（保留函数名，崩了还看得出在哪），
# 体积能砍掉一大截。release 包本来就 strip，这一段只管 debug。
[profile.dev]
strip = "debuginfo"
