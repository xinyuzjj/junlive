[package]
name = "junlive"
version = "0.1.0"
description = "JunLive —— 多平台直播聚合桌面客户端（斗鱼/虎牙/B站/抖音/YouTube/SOOP/Twitch）"
authors = ["xinyuzjj"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "junlive_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP / 异步
# 用 native-tls（Windows 上即 schannel）：斗鱼的部分 CDN 用 rustls 握手会失败
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "native-tls",
  "gzip",
  "brotli",
  "socks",
  "stream",
  "cookies",
] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
# WS 走代理要自己 CONNECT 再套 TLS
native-tls = "0.2"
tokio-native-tls = "0.3"
futures-util = "0.3"

# 本地流代理服务器
axum = "0.8"
bytes = "1"
http-body-util = "0.1"

# 工具
md5 = "0.7"
rand = "0.8"
regex = "1"
base64 = "0.22"
urlencoding = "2"
once_cell = "1"
thiserror = "2"
chrono = "0.4"
brotli = "8"
# 抖音弹幕的帧是 gzip 压缩的
flate2 = "1"

# 抖音 WS 的 X-Bogus 签名要跑 sign.js（混淆 JS），
# 用 QuickJS 在本地算。不开 bindgen 特性——它需要 libclang。
rquickjs = { version = "0.9", default-features = false, features = ["loader", "macro"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
