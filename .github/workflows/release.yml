name: Release

# 打 tag（v1.2.3）就自动出三平台安装包；也可以在 Actions 页面手动触发
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# 默认的 GITHUB_TOKEN 是只读的，创建 Release 需要显式给 contents: write
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：Apple Silicon + Intel 各出一个包
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          # Linux：deb / rpm / AppImage
          - platform: ubuntu-22.04
            target: ""
          # Windows：NSIS 安装包 + MSI
          - platform: windows-latest
            target: ""

    runs-on: ${{ matrix.platform }}

    # 项目里 src-tauri/rust-toolchain.toml 把工具链固定在
    # stable-x86_64-pc-windows-gnu（本地开发机没装 Windows SDK 才这么写）。
    # CI 上要用各平台默认的 MSVC / 系统工具链，用这个环境变量覆盖掉它
    # （rustup 的优先级：RUSTUP_TOOLCHAIN > rust-toolchain.toml > default）。
    env:
      RUSTUP_TOOLCHAIN: stable

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          releaseName: "JunLive ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}"
          releaseBody: |
            多平台直播聚合桌面客户端（斗鱼 / 虎牙 / 哔哩哔哩 / 抖音 / YouTube / SOOP / Twitch）。

            下载对应系统的安装包：
            - **Windows**：`.msi`（MSI 安装包）或 `-setup.exe`（NSIS 安装包）
            - **macOS**：`.dmg`（Apple Silicon 选 `aarch64`，Intel 选 `x64`）
            - **Linux**：`.AppImage`（免安装）/ `.deb`（Debian、Ubuntu）/ `.rpm`（Fedora、RHEL）
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

  # 顺带把 Android APK 也发到同一个 Release。
  # needs: build —— 桌面那四个 job 里 tauri-action 会把 Release 创建出来，
  # 必须等它建好，否则 gh release upload 会找不到 release。
  android:
    needs: build
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不用 android-actions/setup-android（会去装已被 SDK 移除的 tools 包而失败），
      # ubuntu runner 本来就预装了 Android SDK + NDK。
      - name: 配置 Android SDK / NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ]; then NDK="$(ls -d "${ANDROID_HOME}"/ndk/* 2>/dev/null | sort -V | tail -1)"; fi
          if [ -z "$NDK" ]; then echo "::error::没找到 NDK"; exit 1; fi
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          NDKBIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$NDKBIN" >> "$GITHUB_PATH"
          for t in aarch64-linux-android armv7a-linux-androideabi i686-linux-android x86_64-linux-android; do
            sudo ln -sf "$NDKBIN/llvm-ranlib" "/usr/local/bin/$t-ranlib"
            sudo ln -sf "$NDKBIN/llvm-ar" "/usr/local/bin/$t-ar"
          done
          echo "NDK = $NDK"

      - name: 安装 libclang（rquickjs bindgen 用）
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang
          echo "LIBCLANG_PATH=$(llvm-config --libdir 2>/dev/null || echo /usr/lib/llvm-18/lib)" >> "$GITHUB_ENV"

      # bindgen 交叉编译默认用宿主机的 clang 和内建头，会报
      #   /usr/include/limits.h:26:10: fatal error: 'bits/libc-header-start.h' file not found
      # 必须显式把 NDK 的 sysroot 和目标三元组喂给它。
      - name: 让 bindgen 使用 NDK 的 sysroot
        run: |
          SYSROOT="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          for pair in aarch64-linux-android:aarch64-linux-android21 \
                      armv7-linux-androideabi:armv7a-linux-androideabi21 \
                      i686-linux-android:i686-linux-android21 \
                      x86_64-linux-android:x86_64-linux-android21; do
            crate_t="${pair%%:*}"; clang_t="${pair##*:}"
            echo "BINDGEN_EXTRA_CLANG_ARGS_${crate_t//-/_}=--sysroot=${SYSROOT} --target=${clang_t}" >> "$GITHUB_ENV"
          done
          echo "NDK sysroot 已就绪: $SYSROOT"

      - name: 安装 Rust（含 Android 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      # 移动端要 cdylib，且要删掉钉死 Windows 工具链的 rust-toolchain.toml
      - name: 移动端构建适配
        run: |
          sed -i 's/crate-type = \["staticlib", "rlib"\]/crate-type = ["staticlib", "cdylib", "rlib"]/' src-tauri/Cargo.toml
          grep -q 'cdylib' src-tauri/Cargo.toml || { echo "::error::crate-type 替换失败"; exit 1; }
          rm -f src-tauri/rust-toolchain.toml

      # 必须先 init 生成 Android 工程，否则构建会报
      # "Android Studio project directory .../src-tauri/gen/android doesn't exist"
      - name: 生成 Android 工程
        run: npx tauri android init --ci --skip-targets-install

      - name: 构建 APK
        run: npx tauri android build --apk --debug --target aarch64

      - name: 把 APK 传进 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.1' }}"
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then echo "::error::没找到 APK"; exit 1; fi
          echo "APK = $APK"
          cp "$APK" "JunLive-${TAG}-android-arm64.apk"
          ls -la "JunLive-${TAG}-android-arm64.apk"
          gh release upload "$TAG" "JunLive-${TAG}-android-arm64.apk" --clobber
          gh release view "$TAG" --json assets -q '.assets[].name'
