name: Mobile

# 手机端构建全部跑在 GitHub 的 runner 上：
#   - Android 用 ubuntu runner（预装 Android SDK，NDK 现装）
#   - iOS 用 macOS runner（预装 Xcode）
# 本地不需要装 SDK / NDK / Xcode。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不要用 android-actions/setup-android：它会去装已被 SDK 移除的 `tools` 包，
      # 报 "Failed to find package 'tools'" 直接失败。
      # GitHub 的 ubuntu runner 本来就预装了 Android SDK + NDK，直接用即可。
      - name: 配置 Android SDK / NDK（用 runner 预装的）
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ]; then
            NDK="$(ls -d "${ANDROID_HOME}"/ndk/* 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$NDK" ]; then echo "::error::没找到 NDK"; exit 1; fi
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "SDK = ${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "NDK = $NDK"
          ls "$NDK" | head -5

          # openssl 的 vendored 构建（见 Cargo.toml）会在 Makefile 里直接调
          # `<target>-ranlib`，但 NDK 只提供 llvm-ranlib，导致
          # `aarch64-linux-android-ranlib: not found` → make install_dev 失败。
          # 补一套软链，并把 NDK 的 bin 加进 PATH。
          NDKBIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$NDKBIN" >> "$GITHUB_PATH"
          for t in aarch64-linux-android armv7a-linux-androideabi i686-linux-android x86_64-linux-android; do
            sudo ln -sf "$NDKBIN/llvm-ranlib" "/usr/local/bin/$t-ranlib"
            sudo ln -sf "$NDKBIN/llvm-ar" "/usr/local/bin/$t-ar"
          done
          aarch64-linux-android-ranlib --version | head -1

      # rquickjs 的 bindgen 特性需要 libclang 现场生成 Android 绑定
      - name: 安装 libclang（rquickjs bindgen 用）
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang
          echo "LIBCLANG_PATH=$(llvm-config --libdir 2>/dev/null || echo /usr/lib/llvm-18/lib)" >> "$GITHUB_ENV"
          ls /usr/lib/llvm-*/lib/libclang.so* 2>/dev/null | head -3 || true

      # 光装 libclang 不够：bindgen 交叉编译时默认用**宿主机的** clang 和内建头，
      # 于是 rquickjs-sys 构建时报
      #   /usr/include/limits.h:26:10: fatal error: 'bits/libc-header-start.h' file not found
      # （那是 glibc 的头，Android 目标根本不该去用）。
      # 必须显式把 NDK 的 sysroot 和目标三元组喂给 bindgen。
      - name: 让 bindgen 使用 NDK 的 sysroot
        run: |
          SYSROOT="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          if [ ! -d "$SYSROOT" ]; then echo "::error::NDK sysroot 不存在: $SYSROOT"; exit 1; fi
          for pair in \
            aarch64-linux-android:aarch64-linux-android21 \
            armv7-linux-androideabi:armv7a-linux-androideabi21 \
            i686-linux-android:i686-linux-android21 \
            x86_64-linux-android:x86_64-linux-android21
          do
            crate_t="${pair%%:*}"; clang_t="${pair##*:}"
            var="BINDGEN_EXTRA_CLANG_ARGS_${crate_t//-/_}"
            echo "${var}=--sysroot=${SYSROOT} --target=${clang_t}" >> "$GITHUB_ENV"
            echo "${var} = --sysroot=${SYSROOT} --target=${clang_t}"
          done
          ls "$SYSROOT/usr/include/bits/libc-header-start.h" && echo "sysroot 头文件就位 ✅"

      - name: 安装 Rust（含 Android 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      # 移动端要两处适配：
      # 1) crate-type 必须带 cdylib（Tauri 移动端要求），但本地 Windows GNU
      #    加了会链接失败（`export ordinal too large`），所以仓库里不带。
      # 2) rust-toolchain.toml 把工具链钉在 stable-x86_64-pc-windows-gnu
      #    （本地没 Windows SDK 才这么写）。光靠 RUSTUP_TOOLCHAIN 环境变量
      #    不够 —— xcodebuild 的脚本阶段会拿到净化过的环境，rustup 找不到
      #    Windows 工具链就报 `target tuple in channel name '...-gnu'`。
      #    直接删掉文件最稳。
      - name: 移动端构建适配（cdylib + 去掉 Windows 工具链固定）
        run: |
          sed -i 's/crate-type = \["staticlib", "rlib"\]/crate-type = ["staticlib", "cdylib", "rlib"]/' src-tauri/Cargo.toml
          grep -q 'cdylib' src-tauri/Cargo.toml || { echo "::error::crate-type 替换失败"; exit 1; }
          rm -f src-tauri/rust-toolchain.toml
          grep -n 'crate-type' src-tauri/Cargo.toml
          echo "rust-toolchain.toml 已移除"

      - name: 生成 Android 工程
        run: npx tauri android init --ci --skip-targets-install

      - name: 构建 APK（debug，免签名）
        run: npx tauri android build --apk --debug --target aarch64

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: junlive-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  ios:
    runs-on: macos-latest
    # iOS 没签名证书只能出未签名产物，先不阻塞整条流水线
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Rust（含 iOS 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装 iOS 构建依赖
        run: brew install xcodegen

      # iOS 也要开 rquickjs 的 bindgen（见 Cargo.toml 的 target_os="ios" 段），
      # 而 bindgen 依赖 libclang。macOS runner 上它随 Xcode 一起来，
      # 但 clang-sys 不总能自动找到，显式指一下最稳。
      - name: 定位 libclang（给 bindgen 用）
        run: |
          XCODE_DEV="$(xcode-select -p)"
          LLVM_LIB="$(dirname "$(find "$XCODE_DEV/Toolchains/XcodeDefault.xctoolchain/usr/lib" -name 'libclang.dylib' 2>/dev/null | head -1)")"
          if [ -z "$LLVM_LIB" ] || [ "$LLVM_LIB" = "." ]; then
            LLVM_LIB="$XCODE_DEV/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          fi
          echo "LIBCLANG_PATH=$LLVM_LIB" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH = $LLVM_LIB"
          ls "$LLVM_LIB"/libclang*.dylib 2>/dev/null | head -3 || echo "（没列到，靠 Xcode 默认查找）"

      - name: 安装前端依赖
        run: npm ci

      # 同上：移动端要 cdylib，并且要删掉钉死 Windows 工具链的 rust-toolchain.toml
      - name: 移动端构建适配（cdylib + 去掉 Windows 工具链固定）
        run: |
          sed -i '' 's/crate-type = \["staticlib", "rlib"\]/crate-type = ["staticlib", "cdylib", "rlib"]/' src-tauri/Cargo.toml
          grep -q 'cdylib' src-tauri/Cargo.toml || { echo "::error::crate-type 替换失败"; exit 1; }
          rm -f src-tauri/rust-toolchain.toml
          grep -n 'crate-type' src-tauri/Cargo.toml
          echo "rust-toolchain.toml 已移除"

      - name: 生成 iOS 工程
        run: npx tauri ios init --ci --skip-targets-install

      # 没签名证书编不了真机目标（xcodebuild 会报
      # "Signing for ... requires a development team"），
      # 所以改跑模拟器目标，至少验证 iOS 代码能编译通过。
      - name: 构建 iOS（模拟器，免签名）
        run: npx tauri ios build --debug --target aarch64-sim

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: junlive-ios-unsigned
          path: |
            src-tauri/gen/apple/build/**/*.app
            src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: warn
